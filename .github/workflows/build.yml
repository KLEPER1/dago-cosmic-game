name: Build DAGO COSMIC APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Crear proyecto DAGO COSMIC
        run: |
          mkdir -p app/src/main/java/com/dagocosmic/game
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper
          echo 'include(":app")' > settings.gradle.kts
          echo 'plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.20" apply false }' > build.gradle.kts
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.dagocosmic.game"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.dagocosmic.game"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="DAGO COSMIC" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">DAGO COSMIC</string></resources>' > app/src/main/res/values/strings.xml
          echo '<?xml version="1.0" encoding="utf-8"?><FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" />' > app/src/main/res/layout/activity_main.xml
          cat > app/src/main/java/com/dagocosmic/game/MainActivity.kt <<'EOF'
          package com.dagocosmic.game
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          import android.view.Gravity
          import android.graphics.Color
          class MainActivity: AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv=TextView(this)
                  tv.text="🚀 DAGO COSMIC\n\nCOIN DAGO\n\nToca para jugar"
                  tv.setTextColor(Color.parseColor("#FFD700"))
                  tv.textSize=24f
                  tv.gravity=Gravity.CENTER
                  tv.setBackgroundColor(Color.parseColor("#000010"))
                  setContentView(tv)
                  tv.setOnClickListener{tv.text="🌌 Mision Iniciada!\n\n100 COIN DAGO"}
              }
          }
          EOF
          echo 'distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists' > gradle/wrapper/gradle-wrapper.properties
          echo -e '#!/bin/sh\ngradle "$@"' > gradlew
          chmod +x gradlew

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DAGO-COSMIC-APK-GRATIS
          path: app/build/outputs/apk/debug/app-debug.apk
